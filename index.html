<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Churner — Bonus Tracker</title>
    <meta name="description" content="Four-person churning dashboard: track credit card and bank bonuses, spend progress, eligibility rules, and annual fees." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Churner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,body{margin:0}
      html.dark,html.dark body{background:#09090b;color:#fff}
      html:not(.dark),html:not(.dark) body{background:#f4f4f5;color:#18181b}
    </style>
    <script>try{if(localStorage.getItem('churner_theme')==='light'){document.documentElement.classList.remove('dark');document.querySelector('meta[name=theme-color]').setAttribute('content','#f4f4f5')}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family:sans-serif;padding:2rem;color:#fff">JavaScript is required to run Churner.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
